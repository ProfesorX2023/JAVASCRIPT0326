<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
    Reglas:
    1. Solo los mayores de edad pueden beber
    2. Solo los mayores de edad pueden entrar en discotecas
    3. Los mayores de 30  no pueden entrar a la discoteca
    4. Las personas de 25 y 20 años entran grátis
    -->

    <p>Ingrese su edad</p>
    <input 
    type="number" 
    id="textoEdad" 
    placeholder="Ingrese su edad">
    <button onclick="calcular()">Enviar</button>

    <h3>Puede beber?</h3>
    <p id="respuesta1">---</p>
    <h3>Puede entrar?</h3>
    <p id="respuesta2">---</p>
    <h3>Tiene entrada grátis?</h3>
    <p id="respuesta3">---</p>

    <script>
        function calcular(){
            let elementoRespuesta1 = document.getElementById("respuesta1");
            let elementoRespuesta2= document.getElementById("respuesta2");
            let elementoRespuesta3 = document.getElementById("respuesta3");
            let elementoEdad = document.getElementById("textoEdad");
            let edad = elementoEdad.value;

            elementoRespuesta1.textContent = edad >= 18;
            elementoRespuesta2.textContent = edad >= 18 && edad < 30;
            elementoRespuesta3.textContent = edad == 25 || edad == 20; 
        }
    </script>
</body>
</html>
