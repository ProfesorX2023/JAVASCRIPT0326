<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contenedor {
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar contenido"
                "footer footer"
            ;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 80px 1fr 60px;
            height: 100vh;
        }

        .header {
            grid-area: header;
            display: flex;
            background-color: #2950b9;
            color: white;
            justify-content: center;
            align-items: center;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: #34495e;
            color: white;
            padding: 20px;
        }

        .contenido {
            grid-area: contenido;
            background-color: #00f088;
            color: white;
            padding: 20px;
        }

        .footer {
            grid-area: footer;
            background-color: #f7003a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="header">Encabezado</div>
        <div class="sidebar">Menú Lateral</div>
        <div class="contenido">Contenido princial</div>
        <div class="footer">Pié de página</div>
    </div>
</body>
</html>
