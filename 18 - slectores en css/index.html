<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* your styles go here */
        h3{
            background-color: crimson;
            width: 50%;
            color: white;
            text-align: center;
        }

        p{
            color: rgb(255,125,25);
        }

        .contenedor {
            background-color: black;
            width: 50%;
            margin: 0 auto;
        }

        #titulo-importante {
            background-color: darkblue;
        }

        div p{
            color: greenyellow;
        }
    </style>
</head>
<body>
    <h3>Subtitulo menor 1</h3>
    <div class="contenedor">
        <p>Este párrafo esta dentro de la etiqueta div</p>
        <p>Este tambien</p>
    </div>
    <h3 id="titulo-importante">Subtitulo menor 2</h3>
    <p>Este no esta dentro del div</p>
</body>
</html>
