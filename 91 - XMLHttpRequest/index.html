<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="persona">---</p>
    <script>
        let xhr = new XMLHttpRequest();
        xhr.open('GET','persona.json',true);
        xhr.responseType = 'json';
        xhr.onload = function(){
            if(xhr.status === 200){
                let datosJson = xhr.response;
                let elementoTexto = document.getElementById("persona")
                elementoTexto.textContent = datosJson.nombre + " " + datosJson.edad;
                console.log(datosJson.nombre + " " + datosJson.edad);
            }else {
                console.log("❌ No se encuentra");
            }
        }

        xhr.send();
    </script>
</body>
</html>
