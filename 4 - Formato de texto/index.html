<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Esta es mas utilizada -->
    <p>Esta <em>palabra</em>tiene énfasis</p>
    <p>Esta <i>palabra</i> tiene cursiva</p>
    <!-- Esta es más utilizada -->
    <p>Esta <strong>palabra</strong> es muy fuerte</p>
    <p>Esta <b>palabra</b> esta en negrita</p>
    <p>Esta <small>palabra</small> es pequeña</p>
    <p>Esta <del>palabra</del> esta tachada</p>
    <!-- Esta es más utilizada -->
    <p>Esta <ins>palabra</ins> esta insertada</p>
    <p>Esta <u>palabra</u> esta subrayada</p>
    <p>Esta <mark>palabra</mark> esta macada</p>
</body>
</html>
